# Deploy no Fly.io: veja DEPLOY.md
app = "painel-apuracao-2026"
primary_region = "gru"          # São Paulo

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  CLIENT_IP_HEADER = "fly-client-ip"

[mounts]
  source = "dados"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # O coletor precisa rodar o tempo todo e o chat guarda estado em memória:
  # uma única máquina, sempre ligada.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 1500
    hard_limit = 2000

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
